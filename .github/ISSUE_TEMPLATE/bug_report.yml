name: Bug report
description: Something in the pane, tool or commands is wrong
labels: [bug]
body:
  - type: input
    id: cc-version
    attributes: { label: Claude Code version, description: Output of `claude --version`, placeholder: 2.1.296 }
    validations: { required: true }
  - type: input
    id: plugin-version
    attributes: { label: Intent Ledger version, placeholder: 0.4.2 }
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it
      options: [Terminal docked pane, Terminal inline summary, Desktop app, VS Code, Mobile, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "Include your `palette`/option changes. `/ledger copy` output helps; remove anything private." }
