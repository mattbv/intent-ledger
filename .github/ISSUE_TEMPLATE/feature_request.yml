name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to see or do that you cannot today? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Rough idea, description: "Reminder: the ledger only uses what the agent states openly; it never reads hidden reasoning or makes network calls." }
